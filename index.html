<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallows &amp; Guesses — A Hangman Game</title>
<meta name="description" content="A playful browser Hangman game with category picks, dark/light mode, and an animated gallows.">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Quicksand:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="stage">

  <header class="topbar">
    <button id="homeLink" class="brand" type="button" aria-label="Back to home">
      <h1 class="brand__title">Gallows &amp; Guesses</h1>
    </button>
    <div class="topbar__controls">
      <button id="soundToggle" class="icon-toggle" type="button" aria-pressed="true" aria-label="Mute sound">
        <span class="icon-toggle__glyph" aria-hidden="true">♪</span>
      </button>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
        <span class="theme-toggle__track">
          <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">☀️</span>
          <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">🌙</span>
          <span class="theme-toggle__thumb"></span>
        </span>
      </button>
    </div>
  </header>

  <!-- SCREEN 1: category picker -->
  <section id="pickerScreen" class="screen picker" aria-labelledby="pickerHeading">
    <p class="eyebrow">Step right up</p>
    <h2 id="pickerHeading">Pick your category</h2>
    <p class="picker__sub">Six wrong guesses is all the rope you get.</p>
    <div id="streakRow" class="streak-row" aria-live="polite"></div>
    <div id="categoryGrid" class="category-grid" role="list"></div>
  </section>

  <!-- SCREEN 2: game -->
  <section id="gameScreen" class="screen game" aria-labelledby="gameHeading" hidden>

    <div class="game__top">
      <button id="backBtn" class="link-btn" type="button">&larr; Change category</button>
      <h2 id="gameHeading" class="game__category">Category</h2>
    </div>

    <p id="clueText" class="clue-text"></p>

    <div class="game__layout">

      <div class="gallows-pane">
        <div class="arena">
          <svg class="arena-bg" viewBox="0 -60 300 400" aria-hidden="true">
            <defs>
              <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="var(--sky-top)"/>
                <stop offset="100%" stop-color="var(--sky-bottom)"/>
              </linearGradient>
            </defs>

            <!-- sky -->
            <rect x="-20" y="-60" width="340" height="140" fill="url(#skyGrad)"/>
            <circle class="sun-glow" cx="245" cy="-25" r="42"/>
            <circle class="sun-core" cx="245" cy="-25" r="16"/>

            <!-- outer tier (farthest) -->
            <path class="band band--outer" d="M -15,310 L -15,10 Q 150,-55 315,10 L 315,310 Z"/>
            <line class="arena-tier" x1="8" y1="180" x2="30" y2="180"/>
            <path class="arch arch--outer" d="M 4,178 v-14 a8,8 0 0 1 16,0 v14 Z"/>
            <path class="arch arch--outer" d="M 280,178 v-14 a8,8 0 0 1 16,0 v14 Z"/>
            <line class="arena-tier" x1="270" y1="180" x2="292" y2="180"/>

            <!-- mid tier -->
            <path class="band band--mid" d="M 25,310 L 25,55 Q 150,-15 275,55 L 275,310 Z"/>
            <path class="arch arch--mid" d="M 34,205 v-18 a10,10 0 0 1 20,0 v18 Z"/>
            <path class="arch arch--mid" d="M 62,190 v-18 a10,10 0 0 1 20,0 v18 Z"/>
            <path class="arch arch--mid" d="M 218,190 v-18 a10,10 0 0 1 20,0 v18 Z"/>
            <path class="arch arch--mid" d="M 246,205 v-18 a10,10 0 0 1 20,0 v18 Z"/>

            <!-- inner tier (closest, ringside) -->
            <path class="band band--inner" d="M 65,310 L 65,110 Q 150,30 235,110 L 235,310 Z"/>
            <path class="arch arch--inner" d="M 78,278 v-22 a12,12 0 0 1 24,0 v22 Z"/>
            <path class="arch arch--inner" d="M 112,262 v-22 a12,12 0 0 1 24,0 v22 Z"/>
            <path class="arch arch--inner" d="M 164,262 v-22 a12,12 0 0 1 24,0 v22 Z"/>
            <path class="arch arch--inner" d="M 198,278 v-22 a12,12 0 0 1 24,0 v22 Z"/>

            <!-- spectators peeking from the ringside arches: mixed reactions -->
            <circle class="crowd-dot crowd-cheer" cx="86" cy="262" r="3"/>
            <circle class="crowd-dot crowd-mercy" cx="96" cy="264" r="3"/>
            <circle class="crowd-dot crowd-mercy" cx="120" cy="248" r="3"/>
            <circle class="crowd-dot crowd-cheer" cx="130" cy="250" r="3"/>
            <circle class="crowd-dot crowd-cheer" cx="172" cy="248" r="3"/>
            <circle class="crowd-dot crowd-cheer" cx="182" cy="250" r="3"/>
            <circle class="crowd-dot crowd-mercy" cx="206" cy="262" r="3"/>
            <circle class="crowd-dot crowd-cheer" cx="216" cy="264" r="3"/>

            <!-- imperial box, top center -->
            <polygon class="arena-wall" points="150,-52 116,-24 184,-24"/>
            <rect class="arena-wall" x="103" y="-24" width="94" height="26" rx="8"/>
            <g class="royal-figure">
              <polygon class="royal-crown" points="150,-40 145,-32 155,-32"/>
              <circle cx="150" cy="-26" r="6"/>
              <path d="M 138 -6 Q 150 -18 162 -6 L 162 0 L 138 0 Z"/>
            </g>
            <g class="royal-attendant">
              <circle cx="126" cy="-22" r="4"/>
              <path d="M 120 -8 Q 126 -16 132 -8 Z"/>
            </g>
            <g class="royal-attendant">
              <circle cx="174" cy="-22" r="4"/>
              <path d="M 168 -8 Q 174 -16 180 -8 Z"/>
            </g>

            <!-- sand floor -->
            <ellipse class="arena-floor" cx="150" cy="325" rx="145" ry="16"/>
            <path class="floor-crack" d="M 60,320 L 110,312 M 150,309 L 150,330 M 190,312 L 240,320 M 105,327 L 150,320 L 195,327"/>
          </svg>

          <svg id="gallowsSvg" class="gallows" viewBox="0 -60 300 400" role="img" aria-label="Gallows drawing showing wrong guess progress, standing in the middle of an arena with a divided crowd watching">
            <!-- static rig -->
            <line class="rig" x1="30" y1="320" x2="150" y2="320" />
            <line class="rig" x1="60" y1="320" x2="60" y2="30" />
            <line class="rig" x1="60" y1="30" x2="190" y2="30" />
            <!-- rope: swings via .rope-swing class on wrong guess -->
            <g id="ropeGroup" class="rope-group">
              <line id="rope" class="rope" x1="190" y1="30" x2="190" y2="65" />
            </g>
            <!-- figure parts, each starts hidden via stroke-dasharray trick -->
            <g id="figure" class="figure">
              <circle id="partHead" class="part part--head" cx="190" cy="85" r="20"/>
              <g id="faceNeutral" class="face">
                <circle class="eye" cx="183" cy="82" r="2"/>
                <circle class="eye" cx="197" cy="82" r="2"/>
                <path id="mouth" class="mouth" d="M 182 91 Q 190 91 198 91" />
              </g>
              <line id="partTorso" class="part part--torso" x1="190" y1="105" x2="190" y2="180"/>
              <line id="partArmL" class="part part--armL" x1="190" y1="120" x2="160" y2="150"/>
              <line id="partArmR" class="part part--armR" x1="190" y1="120" x2="220" y2="150"/>
              <line id="partLegL" class="part part--legL" x1="190" y1="180" x2="165" y2="215"/>
              <line id="partLegR" class="part part--legR" x1="190" y1="180" x2="215" y2="215"/>
            </g>
          </svg>
        </div>

        <div class="vitals">
          <div class="lives" id="livesRow" aria-live="polite"></div>
          <p class="wrong-letters">Missed: <span id="wrongLetters">—</span></p>
        </div>
      </div>

      <div class="play-pane">
        <div id="wordRow" class="word-row" aria-live="polite"></div>

        <p id="statusMsg" class="status-msg" role="status" aria-live="assertive">&nbsp;</p>

        <div id="keyboard" class="keyboard"></div>

        <button id="playAgainBtn" class="primary-btn" type="button" hidden>Play again</button>
      </div>

    </div>
  </section>

  <footer class="footer">
    <p>Built for the crowd. No actual rope was harmed.</p>
  </footer>

</div>

<script src="js/script.js"></script>
</body>
</html>
